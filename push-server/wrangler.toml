# GitHub Actions deploys this when it changes (README.md, "Deploy from GitHub"),
# or from a computer: `npm install && npx wrangler deploy` in this folder.
# From an iPad, follow README.md instead (all in the Cloudflare dashboard).
name = "scrabbler-push"
main = "worker.js"
compatibility_date = "2025-09-01"
# Keep any variables set in the dashboard. Secrets such as PASSWORD are always kept.
keep_vars = true

# No id on purpose: a deploy keeps the KV namespace already bound to the worker as
# SCRABBLER (it holds the registered devices and the push keys), and only creates
# one if the worker has none yet. The GitHub deploy pins it to SCRABBLER_KV_ID
# when that repository variable is set.
[[kv_namespaces]]
binding = "SCRABBLER"

# Sync and shared pages (optional). Like the KV namespace above, no id on
# purpose: a deploy keeps the database already bound as SYNC, or creates one.
# The GitHub deploy pins it to SCRABBLER_SYNC_ID when that variable is set.
[[d1_databases]]
binding = "SYNC"
database_name = "scrabbler-sync"

[triggers]
crons = ["* * * * *"]
